    const cats = document.querySelectorAll('.category-card');

    // render all
    function render(filterCat, filterTerm) {
  container.innerHTML = '';
  services.forEach(s => {
    if ((filterCat === 'All' || s.category === filterCat) &&
        s.name.toLowerCase().includes(filterTerm.toLowerCase())) {
      
      const card = document.createElement('div');
      card.className = 'service-card';

      card.innerHTML = `
        <img src="${s.img}" alt="${s.category}" class="service-image"/>
        <div class="service-content">
          <h3 class="service-title">${s.name}</h3>
          <p class="service-desc">${s.desc}</p>
          ${s.address ? `<p class="service-address"><span class="map-icon">📍</span> ${s.address}</p>` : ''}
          ${s.phone ? `<p class="service-phone">📞 ${s.phone}</p>` : ''}
          <div class="service-actions">
            <a href="${s.website}" target="_blank">🌐 Visit Website</a>
          </div>
        </div>
      `;

      container.appendChild(card);
    }
  });

  if (!container.innerHTML) {
    container.innerHTML = '<p class="no-results">No services found.</p>';
  }
}


    // initial render
    render('All','');

    // category click
    cats.forEach(c => {
      c.addEventListener('click', () => {
        cats.forEach(x=>x.classList.remove('active'));
        c.classList.add('active');
        render(c.dataset.category, searchInput.value);
      });
    });

    // search input
    searchInput.addEventListener('input', () => {
      const activeCat = document.querySelector('.category-card.active').dataset.category;
      render(activeCat, searchInput.value);
    });
